<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="Isabella Nottaro Sánchez. Estudio 2º de Desarrollo de Aplicaciones Multiplataforma. No entiendo la tecnología sin la creatividad.">
  <defs>
    <style>
      .mono { font-family: 'Space Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
      .serif { font-family: 'Instrument Serif', 'Playfair Display', Georgia, 'Times New Roman', serif; }
      .ascii { font-size: 14px; letter-spacing: 3px; white-space: pre; }
    </style>

    <g id="filas" class="mono ascii">
      <text x="0" y="16"  xml:space="preserve">·   .  ;=+   .    ·  *#</text>
      <text x="0" y="38"  xml:space="preserve">  .   ·    ;-==-;   .  </text>
      <text x="0" y="60"  xml:space="preserve">=*#  .   ·   +@#=;   · </text>
      <text x="0" y="82"  xml:space="preserve"> ·   ;=##+;    .   ·  .</text>
      <text x="0" y="104" xml:space="preserve">.  ·    .   =#*;  ;  · </text>
      <text x="0" y="126" xml:space="preserve">  +@%  ·  .     ·  -##;</text>
    </g>
    <pattern id="campo" width="300" height="132" patternUnits="userSpaceOnUse">
      <use href="#filas" fill="#2c3680"/>
    </pattern>
    <pattern id="campo2" width="300" height="132" patternUnits="userSpaceOnUse">
      <use href="#filas" fill="#9aa4ff"/>
    </pattern>

    <radialGradient id="foco" gradientUnits="userSpaceOnUse" cx="200" cy="130" r="230">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
      <animate attributeName="cx" values="200;700;520;140;200" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="130;90;230;210;130" dur="16s" repeatCount="indefinite"/>
    </radialGradient>
    <mask id="luz">
      <rect width="900" height="360" fill="url(#foco)"/>
    </mask>

    <linearGradient id="velo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.35" stop-color="#0d1347" stop-opacity="0"/>
      <stop offset="0.8" stop-color="#0d1347" stop-opacity="0.92"/>
    </linearGradient>
    <clipPath id="marco"><rect width="900" height="360" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#marco)">
    <rect width="900" height="360" fill="#0d1347"/>

    <!-- campo ASCII: capa tenue + capa iluminada por un foco que se mueve -->
    <rect width="900" height="360" fill="url(#campo)"/>
    <g mask="url(#luz)">
      <rect width="900" height="360" fill="url(#campo2)"/>
    </g>
    <rect width="900" height="360" fill="url(#velo)"/>

    <!-- barra superior -->
    <text x="36" y="44" class="mono" font-size="14" fill="#b8bce0">isabellanottaro.vercel.app</text>
    <text x="864" y="44" class="mono" font-size="14" fill="#b8bce0" text-anchor="end">2º DAM · A Coruña</text>
    <line x1="36" y1="62" x2="864" y2="62" stroke="#2c3680" stroke-width="1"/>

    <!-- nombre -->
    <text x="34" y="262" class="serif" font-size="92" fill="#f2f1ea" letter-spacing="-2">Isabella Nottaro</text>

    <!-- lema -->
    <text x="36" y="304" class="mono" font-size="15" font-weight="700" fill="#f2f1ea">Estudio 2º de Desarrollo de Aplicaciones Multiplataforma.</text>
    <text x="36" y="328" class="mono" font-size="15" fill="#9aa4ff">No entiendo la tecnología sin la creatividad.<tspan fill="#f2f1ea">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.2s" repeatCount="indefinite"/>▌</tspan></text>
  </g>
</svg>
